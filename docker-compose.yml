services:
  pg-dev:
    build:
      context: .
      args:
        PG_MAJOR: "14"          # Change this to test PostgreSQL versions 12..19

    container_name: pg_cte_force_dev

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: extdev

    ports:
      - "5433:5432"             # Use port 5433 to avoid conflicts with a local PostgreSQL instance

    volumes:
      # Extension source code, editable directly from the host/Claude
      - ./src:/extension

      - pgdata:/var/lib/postgresql
      
      # Database initialization scripts.
      # These scripts are executed only when the database cluster is initialized
      # for the first time.
      - ./init:/docker-entrypoint-initdb.d/

    stdin_open: true
    tty: true

volumes:
  pgdata: